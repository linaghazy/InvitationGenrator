<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Endorphins Art Labs</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">
        <h1>Endorphins Art Labs</h1>
    </header>

    <div class="app">
        <aside class="sidebar">
          
            <div class="sidebar-title">
                <h2>
                    Invitations<br>
                    generator
                </h2>
            </div>

            <section class="upload-section">
                <div class="upload-title">
                     <span class="step">1</span>
                     <h3>Upload Template</h3>

                </div>
                
                <label class="upload-box" for="invitationInput">
                    <div class="upload-icon">▧</div>
                    <div class="upload-text">
        Click to Upload
                    </div>

                    <div class="upload-subtext">
        Image
                    </div>
                    
                </label>

                <input 
        type="file" 
        id="invitationInput" 
        accept="image/*"
        hidden
    >
            </section>
            <section class= "data-source-section">
                <div class="data-source-title">
                     <span class="step">2</span>
                     <h3>Data source</h3>

                </div>

                <label class="csv-upload-button" for="csvInput">
                     <span>↑</span>
                     <span>Upload CSV</span>
                </label>

                <input
                    type="file"
                    id="csvInput"
                    accept=".csv"
                    hidden
                >

                <div class="csv-file-box">
                    <span class="recipients">
                        RECIPIENTS
                    </span>
                    <span <span class="loaded-count" id="loadedCount">0 loaded</span>
                    </span>
                </div>
                <div id="namesList"></div>

                <div class="single-name-section">

    <label for="singleNameInput">
        Or enter one name
    </label>

    <div class="single-name-input-row">
        <input
            type="text"
            id="singleNameInput"
            placeholder="Enter guest name"
        >

        <button id="addNameButton" type="button">
            Add
        </button>
    </div>

</div>
            </section>


             <div class="generate-container">
                <<button id="generateButton" class="generate-box">
                  <span class="download-icon">↓</span>
                  <span>Generate &amp; Download</span>
                </button>

            </div>
        </aside>



        <main class="workspace">
            <div class="preview">
                <div class="preview-header">
                    Invitation Preview 
                </div>

                <div class="invitation-area">
                     <img 
        id="invitationPreview" 
        alt="Invitation preview"
    >

    

    <canvas id="invitationCanvas"></canvas>
                
                <div id="nameOverLay">
                    
                </div>

        </main>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
