<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Invitation Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Invitation Generator</h1>

    <h2>Upload your invitation</h2>

    <input 
        type="file" 
        id="invitationInput" 
        accept="image/*"
    >

    <img 
        id="invitationPreview" 
        alt="Invitation preview"
    >

    <p id="positionText">Click on the invitation to choose where do you want to put the name.</p>

    <button id="generateButton">
    Generate Preview</button>

    <button id="downloadButton">
    Download ZIP
</button>

    <canvas id="invitationCanvas"></canvas>

    <h2>Upload guest names</h2>

    <input
    type="file"
    id="csvInput"
    accept=".csv"
    >

    <div id="namesList"></div>

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
